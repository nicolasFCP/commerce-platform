<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Commerce Platform - Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111827;
        }

        main {
            width: min(100% - 32px, 700px);
            margin: 0 auto;
            padding: 32px 0;
        }

        .store {
            background: white;
            padding: 24px;
            border-radius: 18px;
            margin-bottom: 24px;
        }

        .store h1 {
            margin: 0 0 8px;
        }

        #estado {
            color: #6b7280;
        }

        .categoria {
            margin-bottom: 28px;
        }

        .productos {
            display: grid;
            gap: 12px;
        }

        .producto {
            background: white;
            padding: 18px;
            border-radius: 16px;
        }

        .producto h3 {
            margin: 0 0 8px;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <main>

        <header class="store">
            <h1 id="nombre-comercio">Cargando comercio...</h1>
            <div id="estado">Conectando con Supabase...</div>
        </header>

        <div id="catalogo"></div>

    </main>

    <script type="module" src="./js/catalogo.js"></script>

</body>
</html>
